name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Releases are created as drafts (release-please-config.json) so the installers never see a latest
      # release without binaries; the `binaries` job publishes it after the assets are uploaded.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Build and attach CLI binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Compile binaries for every target
        # Cross-compiles with bun build --compile for bun-linux-x64, bun-linux-arm64, bun-darwin-x64,
        # bun-darwin-arm64 and bun-windows-x64, then writes dist/SHA256SUMS.
        run: bun scripts/build-cli.ts --all
      - name: Smoke-test the Linux binary
        run: bun scripts/smoke-cli-binary.ts dist/epubtrans-linux-x64
      - name: Upload binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            dist/epubtrans-linux-x64 \
            dist/epubtrans-linux-arm64 \
            dist/epubtrans-darwin-x64 \
            dist/epubtrans-darwin-arm64 \
            dist/epubtrans-windows-x64.exe \
            dist/SHA256SUMS \
            --clobber
      - name: Add the word frequency data license to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          printf '\n\n%s\n' "License note: the binaries embed the word frequency lists of packages/core/data/wordfreq/, derived from wordfreq and licensed CC BY-SA 4.0, not under the epubtrans license (see packages/core/data/wordfreq/README.md)." >> release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
      - name: Publish the release
        # Last step on purpose: if anything above fails the release stays a draft and "latest" is unchanged.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest
